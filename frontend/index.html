<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智能盈利管理系统 · 报价台</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #5b8def;
      --accent-dim: #3d5a8a;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --err: #f07178;
      --radius: 10px;
      --font: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, transparent 50%), var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(26, 35, 50, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header p { margin: 0.25rem 0 0; font-size: 0.85rem; color: var(--muted); }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
    }
    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #121a26;
      color: var(--text);
      font-size: 0.9rem;
      margin-bottom: 0.65rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(91, 141, 239, 0.25);
    }
    textarea { min-height: 100px; font-family: ui-monospace, monospace; font-size: 0.8rem; }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 120px; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      background: var(--accent);
      color: #fff;
      transition: background 0.15s;
    }
    button:hover { background: #6a9af5; }
    button.secondary { background: var(--border); color: var(--text); }
    button.secondary:hover { background: #3d4d66; }
    button.danger { background: #a44; }
    button.danger:hover { #b55; }
    .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .msg {
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
    .msg.show { display: block; }
    .msg.err { background: rgba(240, 113, 120, 0.15); color: var(--err); border: 1px solid rgba(240, 113, 120, 0.35); }
    .msg.ok { background: rgba(62, 207, 142, 0.12); color: var(--ok); border: 1px solid rgba(62, 207, 142, 0.3); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td { text-align: left; padding: 0.45rem 0.5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    tr { cursor: pointer; }
    tr:hover { background: rgba(91, 141, 239, 0.08); }
    tr.active { background: rgba(91, 141, 239, 0.18); }
    .span-2 { grid-column: 1 / -1; }
    .mono { font-family: ui-monospace, monospace; font-size: 0.78rem; }
    .pill {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.72rem;
      background: var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>智能盈利管理系统 · 报价台</h1>
    <p>连接后端 API，创建报价、查看列表、议价与审批。请先启动后端（<span class="mono">--port</span> 可改为任意未占用端口，与浏览器 URL 端口一致即可），例如：<span class="mono">uvicorn app.main:app --reload --host 127.0.0.1 --port 8080</span>，再打开 <span class="mono">http://127.0.0.1:8080/ui/</span>（端口请与命令中相同）。</p>
  </header>
  <main>
    <section class="card">
      <h2>接口地址</h2>
      <label for="apiBase">API 根路径（默认与当前站点同源）</label>
      <input id="apiBase" type="text" placeholder="/api/v1 或完整 URL" />
      <div class="toolbar">
        <button type="button" class="secondary" id="btnPing">测试连接</button>
      </div>
      <div id="pingMsg" class="msg"></div>
    </section>

    <section class="card">
      <h2>新建报价</h2>
      <form id="formCreate">
        <div class="row">
          <div><label>客户 ID</label><input name="customer_id" type="number" value="1" required /></div>
          <div><label>产品 ID</label><input name="product_id" type="number" value="1" required /></div>
          <div><label>数量</label><input name="quantity" type="number" value="100" min="1" required /></div>
        </div>
        <label>项目名称</label>
        <input name="project_name" type="text" placeholder="可选" />
        <div class="row">
          <div><label>要求交期（天）</label><input name="requested_delivery_days" type="number" min="1" placeholder="可选" /></div>
          <div style="display:flex;align-items:flex-end;padding-bottom:0.65rem;">
            <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;margin:0;">
              <input name="is_must_win" type="checkbox" /> 必拿单
            </label>
          </div>
        </div>
        <button type="submit">创建报价</button>
      </form>
      <div id="createMsg" class="msg"></div>
    </section>

    <section class="card span-2">
      <h2>报价列表</h2>
      <div class="toolbar">
        <button type="button" class="secondary" id="btnRefreshList">刷新</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>单号</th>
              <th>项目</th>
              <th>状态</th>
              <th>建议价</th>
              <th>渠道</th>
            </tr>
          </thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
      <div id="listMsg" class="msg"></div>
    </section>

    <section class="card span-2">
      <h2>详情与操作 <span id="selLabel" class="pill">未选择</span></h2>
      <p style="margin:0 0 0.75rem;font-size:0.85rem;color:var(--muted);">点击上表一行选择报价单。</p>
      <div class="toolbar">
        <button type="button" class="secondary" id="btnLoadDetail" disabled>加载详情</button>
        <button type="button" class="secondary" id="btnLogs" disabled>议价日志</button>
        <button type="button" class="secondary" id="btnCompare" disabled>比价（占位）</button>
        <button type="button" class="secondary" id="btnSense" disabled>敏感度</button>
        <button type="button" id="btnSend" disabled>发送客户</button>
      </div>
      <div class="row" style="margin-top:0.75rem;">
        <div>
          <label>议价动作</label>
          <select id="negAction">
            <option value="counter">还价 counter</option>
            <option value="accept">接受 accept</option>
            <option value="reject">拒绝 reject</option>
          </select>
        </div>
        <div><label>客户目标价（可选）</label><input id="negPrice" type="text" placeholder="如 1200.50" /></div>
      </div>
      <label>议价说明（可选）</label>
      <input id="negReason" type="text" placeholder="客户理由" />
      <div class="toolbar">
        <button type="button" id="btnNegotiate" disabled>提交议价</button>
      </div>
      <div class="row" style="margin-top:0.75rem;">
        <div>
          <label>审批</label>
          <select id="apprDecision">
            <option value="approve">通过 approve</option>
            <option value="reject">驳回 reject</option>
          </select>
        </div>
        <div><label>关联议价 ID negotiation_id</label><input id="apprNegId" type="number" placeholder="从日志取最新一条" /></div>
      </div>
      <label>审批理由（≥10 字）</label>
      <input id="apprReason" type="text" value="依据合同约定与毛利底线，同意本次报价通过审批。" />
      <div class="toolbar">
        <button type="button" class="secondary" id="btnApprove" disabled>提交审批</button>
      </div>
      <label style="margin-top:0.75rem;">响应 / JSON</label>
      <textarea id="output" readonly spellcheck="false"></textarea>
      <div id="detailMsg" class="msg"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function defaultApiBase() {
      const v = $("apiBase").value.trim();
      if (v) {
        if (v.startsWith("http")) return v.replace(/\/$/, "");
        if (v.startsWith("/")) return window.location.origin + v.replace(/\/$/, "");
        return window.location.origin + "/" + v.replace(/\/$/, "");
      }
      return window.location.origin + "/api/v1";
    }

    function show(el, text, ok) {
      el.textContent = text;
      el.className = "msg show " + (ok ? "ok" : "err");
    }
    function hide(el) {
      el.className = "msg";
      el.textContent = "";
    }

    let selectedId = null;

    function setSelected(id) {
      selectedId = id;
      $("selLabel").textContent = id != null ? "quote_id=" + id : "未选择";
      const on = id != null;
      ["btnLoadDetail","btnLogs","btnCompare","btnSense","btnSend","btnNegotiate","btnApprove"].forEach((x) => { $(x).disabled = !on; });
      document.querySelectorAll("#listBody tr").forEach((tr) => {
        tr.classList.toggle("active", tr.dataset.id === String(id));
      });
    }

    async function api(path, opts = {}) {
      const base = defaultApiBase();
      const url = base + (path.startsWith("/") ? path : "/" + path);
      const headers = { Accept: "application/json", ...(opts.headers || {}) };
      if (opts.body && typeof opts.body === "object" && !(opts.body instanceof FormData)) {
        headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(opts.body);
      }
      const res = await fetch(url, { ...opts, headers });
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!res.ok) {
        const detail = data && data.detail != null ? JSON.stringify(data.detail) : text;
        throw new Error(res.status + " " + detail);
      }
      return data;
    }

    $("apiBase").placeholder = "/api/v1";
    if (window.location.pathname.startsWith("/ui")) $("apiBase").value = "/api/v1";

    $("btnPing").onclick = async () => {
      const el = $("pingMsg");
      hide(el);
      try {
        await api("/quotations/?page=1&page_size=1");
        show(el, "连接正常。", true);
      } catch (e) {
        show(el, String(e.message || e), false);
      }
    };

    $("formCreate").onsubmit = async (ev) => {
      ev.preventDefault();
      const el = $("createMsg");
      hide(el);
      const fd = new FormData(ev.target);
      const body = {
        customer_id: Number(fd.get("customer_id")),
        product_id: Number(fd.get("product_id")),
        quantity: Number(fd.get("quantity")),
        project_name: fd.get("project_name") || null,
        requested_delivery_days: fd.get("requested_delivery_days") ? Number(fd.get("requested_delivery_days")) : null,
        is_must_win: fd.get("is_must_win") === "on",
      };
      try {
        const q = await api("/quotations/", { method: "POST", body });
        show(el, "已创建 quote_id=" + q.quote_id + " · " + (q.quote_number || ""), true);
        $("output").value = JSON.stringify(q, null, 2);
        await refreshList();
        setSelected(q.quote_id);
      } catch (e) {
        show(el, String(e.message || e), false);
      }
    };

    async function refreshList() {
      const el = $("listMsg");
      hide(el);
      const tbody = $("listBody");
      tbody.innerHTML = "";
      try {
        const rows = await api("/quotations/?page=1&page_size=50");
        if (!Array.isArray(rows)) throw new Error("列表格式异常");
        rows.forEach((r) => {
          const tr = document.createElement("tr");
          tr.dataset.id = r.quote_id;
          tr.innerHTML =
            "<td class='mono'>" + r.quote_id + "</td>" +
            "<td class='mono'>" + (r.quote_number || "") + "</td>" +
            "<td>" + (r.project_name || "") + "</td>" +
            "<td><span class='pill'>" + (r.approval_status || "") + "</span></td>" +
            "<td>" + (r.suggested_price != null ? r.suggested_price : "") + "</td>" +
            "<td>" + (r.routing_channel || "") + "</td>";
          tr.onclick = () => setSelected(r.quote_id);
          tbody.appendChild(tr);
        });
        if (selectedId != null && !rows.some((r) => r.quote_id === selectedId)) setSelected(null);
      } catch (e) {
        show(el, String(e.message || e), false);
      }
    }

    $("btnRefreshList").onclick = refreshList;

    $("btnLoadDetail").onclick = async () => {
      const el = $("detailMsg");
      hide(el);
      try {
        const q = await api("/quotations/" + selectedId);
        $("output").value = JSON.stringify(q, null, 2);
      } catch (e) {
        show(el, String(e.message || e), false);
      }
    };

    $("btnLogs").onclick = async () => {
      const el = $("detailMsg");
      hide(el);
      try {
        const log = await api("/quotations/" + selectedId + "/negotiations?page=1&page_size=50");
        $("output").value = JSON.stringify(log, null, 2);
        const recs = log.records || [];
        if (recs.length) $("apprNegId").value = recs[recs.length - 1].negotiation_id;
      } catch (e) {
        show(el, String(e.message || e), false);
      }
    };

    $("btnCompare").onclick = async () => {
      const el = $("detailMsg");
      hide(el);
      try {
        const d = await api("/quotations/" + selectedId + "/price-comparison");
        $("output").value = JSON.stringify(d, null, 2);
      } catch (e) {
        show(el, String(e.message || e), false);
      }
    };

    $("btnSense").onclick = async () => {
      const el = $("detailMsg");
      hide(el);
      try {
        const d = await api("/quotations/" + selectedId + "/sensitivity-analysis");
        $("output").value = JSON.stringify(d, null, 2);
      } catch (e) {
        show(el, String(e.message || e), false);
      }
    };

    $("btnSend").onclick = async () => {
      const el = $("detailMsg");
      hide(el);
      try {
        const d = await api("/quotations/" + selectedId + "/send-to-customer", { method: "POST" });
        $("output").value = JSON.stringify(d, null, 2);
        await refreshList();
      } catch (e) {
        show(el, String(e.message || e), false);
      }
    };

    $("btnNegotiate").onclick = async () => {
      const el = $("detailMsg");
      hide(el);
      const customer_action = $("negAction").value;
      const customer_target_price = $("negPrice").value.trim() || null;
      const customer_reason = $("negReason").value.trim() || null;
      const body = {
        quote_id: selectedId,
        customer_action,
        customer_target_price,
        customer_reason,
      };
      try {
        const d = await api("/quotations/" + selectedId + "/negotiate", { method: "POST", body });
        $("output").value = JSON.stringify(d, null, 2);
        await refreshList();
      } catch (e) {
        show(el, String(e.message || e), false);
      }
    };

    $("btnApprove").onclick = async () => {
      const el = $("detailMsg");
      hide(el);
      const reason = $("apprReason").value.trim();
      if (reason.length < 10) {
        show(el, "审批理由至少 10 个字。", false);
        return;
      }
      const negotiation_id = Number($("apprNegId").value);
      if (!negotiation_id) {
        show(el, "请填写 negotiation_id（可先点「议价日志」自动填入最新一条）。", false);
        return;
      }
      const body = {
        quote_id: selectedId,
        negotiation_id,
        decision: $("apprDecision").value,
        reason,
      };
      try {
        const d = await api("/quotations/" + selectedId + "/approve", { method: "POST", body });
        $("output").value = JSON.stringify(d, null, 2);
        await refreshList();
      } catch (e) {
        show(el, String(e.message || e), false);
      }
    };

    refreshList();
  </script>
</body>
</html>
